name: Lint Frontend
on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: 22

jobs:
  vp-check:
    name: vp check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6.1.0
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install
      - run: pnpm run vp:check

  typecheck:
    name: tsc
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6.1.0
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - name: Install Rust toolchain
        run: rustup toolchain install --no-self-update
      - uses: Swatinem/rust-cache@v2.9.3
      - uses: taiki-e/install-action@v2.87.31
        with:
          tool: wasm-bindgen@0.2.129
      - run: pnpm install
      - run: pnpm run build:wasm
      - run: pnpm run check

  test:
    name: vp test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18@sha256:74935e72241653ca55e0414067e6d8763aceb8a810eb51b452253ec3dcfc4336
        env:
          POSTGRES_PASSWORD: procnote
          POSTGRES_DB: procnote
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PROCNOTE_TEST_DATABASE_URL: postgres://postgres:procnote@localhost:5432/procnote
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6.1.0
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - name: Install Rust toolchain
        run: rustup toolchain install --no-self-update
      - uses: Swatinem/rust-cache@v2.9.3
      - uses: taiki-e/install-action@v2.87.31
        with:
          tool: wasm-bindgen@0.2.129
      - run: pnpm install
      - run: pnpm run build:wasm
      - run: pnpm test

  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6.1.0
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - name: Install Rust toolchain
        run: rustup toolchain install --no-self-update
      - uses: Swatinem/rust-cache@v2.9.3
      - uses: taiki-e/install-action@v2.87.31
        with:
          tool: wasm-bindgen@0.2.129
      - run: pnpm install
      - run: pnpm run build
      - run: pnpm run build:collab

  collect-lint-frontend:
    needs: [vp-check, typecheck, test, build]
    runs-on: ubuntu-latest
    steps:
      - run: echo "All frontend checks passed!"
