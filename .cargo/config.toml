[env]
TS_RS_EXPORT_DIR = { value = "src/lib/types/generated", relative = true }

[target.'cfg(all(target_os = "windows", target_env = "msvc"))']
rustflags = ["-C", "target-feature=+crt-static"]

# Supply-chain hardening: the resolver ignores registry versions published less
# than 7 days ago (matching Renovate's minimumReleaseAge). Lockfile builds are
# unaffected. To take an urgent fix earlier, re-resolve with
# `CARGO_RESOLVER_INCOMPATIBLE_PUBLISH_AGE=allow cargo update -p <crate>`.
[registry]
global-min-publish-age = "7 days"
